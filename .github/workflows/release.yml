name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run pack:win
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Windows 64 位发行版。核心推演完全离线且不依赖 AI。

            注意：本版本未使用商业代码签名证书，Windows SmartScreen 可能显示未知发布者。
